# Publishes the client as a static site on GitHub Pages. Browser mode needs no server,
# so the deployed site is fully functional (users bring their own API key or use the offline demo).
name: Deploy to GitHub Pages

# Manual only: publishing a public site is the repo owner's call. Run it from the Actions tab
# (after Settings → Pages → Source: GitHub Actions), or add a `push: branches: [main]` trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
